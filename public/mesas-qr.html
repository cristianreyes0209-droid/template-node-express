<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Mesas — Las Crepes de París</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f5f0e8;
    margin: 0;
    padding: 24px;
    color: #3B1A0A;
  }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .toolbar h1 { font-size: 20px; margin: 0; }
  .toolbar button {
    background: #C41E3A;
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    font-size: 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }
  .card {
    background: #fff;
    border: 2px solid #3B1A0A22;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    page-break-inside: avoid;
    page-break-after: always;
  }
  .card img { width: 100%; max-width: 260px; height: auto; }
  .card .piso { font-size: 13px; color: #8a6f5c; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 10px; }
  .card .mesa { font-size: 28px; font-weight: 900; margin: 4px 0 12px; }
  .card .marca { font-size: 13px; color: #8a6f5c; margin-top: 10px; }
  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .grid { display: block; }
    .card { border: none; width: 100%; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <h1>🍽️ QR de mesas — La Villa</h1>
    <button onclick="window.print()" title="En el diálogo de impresión elige 'Guardar como PDF' para descargarlo">🖨️ Imprimir / Descargar PDF</button>
  </div>
  <div class="grid" id="grid"></div>

<script>
const MESAS_FISICAS = [
  { pref: "Piso 1", nombres: Array.from({ length: 9 }, (_, i) => "Mesa " + (i + 1)) },
  { pref: "Piso 2", nombres: Array.from({ length: 6 }, (_, i) => "Mesa " + (i + 1)) },
];

const grid = document.getElementById("grid");
const origen = window.location.origin;

MESAS_FISICAS.forEach(sec => {
  sec.nombres.forEach(nom => {
    const mesaLabel = sec.pref + " · " + nom;
    const url = origen + "/carta?mesa=" + encodeURIComponent(mesaLabel) + "&cliente=1";
    const qrImg = "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + encodeURIComponent(url);

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${qrImg}" alt="QR ${mesaLabel}">
      <div class="piso">${sec.pref}</div>
      <div class="mesa">${nom}</div>
      <div class="marca">🥞 Las Crepes de París — escanea para pedir</div>
    `;
    grid.appendChild(card);
  });
});
</script>
</body>
</html>
