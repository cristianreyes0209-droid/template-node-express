<head>

  <title>Las Crepes 🥞</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{background:#FFF5D0;font-family:'Nunito',sans-serif;color:#3B1A0A;min-height:100vh;overflow-x:hidden;}

    /* HEADER */
    .hdr{background:#fff;color:#3B1A0A;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 3px 14px rgba(0,0,0,.12);border-bottom:4px solid #C41E3A;}
    .hdr-logo{font-family:'Anton',sans-serif;font-size:26px;letter-spacing:2px;color:#C41E3A;line-height:1.1;}
    .hdr-sub{font-size:9px;color:#8B5E3C;margin-top:1px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;}
    .cart-btn{background:#C41E3A;border:none;border-radius:50px;padding:10px 18px;font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;cursor:pointer;color:#fff;display:flex;align-items:center;gap:6px;transition:transform .15s;box-shadow:0 2px 8px rgba(196,30,58,.3);}
    .cart-btn:active{transform:scale(.93);}
    .cart-count{background:#F4C430;color:#2C1810;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;}
    @keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
    .cbounce{animation:bounce .35s ease;}

    /* HERO BANNER */
    .hero{background:linear-gradient(135deg,#C41E3A 0%,#E8872A 100%);color:#fff;padding:18px 20px 16px;text-align:center;}
    .hero-title{font-family:'Anton',sans-serif;font-size:36px;letter-spacing:2px;text-shadow:2px 2px 0 rgba(0,0,0,.2);}
    .hero-sub{font-size:13px;opacity:.85;margin-top:2px;}

    /* STICKY NAV WRAPPER — header + cats como una sola unidad sticky */
    .sticky-nav{position:sticky;top:0;z-index:100;}

    /* CATEGORY TABS */
    .cats{background:#fff;overflow-x:auto;padding:10px 12px;display:flex;gap:8px;scrollbar-width:none;box-shadow:0 2px 10px rgba(0,0,0,.08);}
    .cats::-webkit-scrollbar{display:none;}
    .cat-tab{flex-shrink:0;padding:8px 16px;border-radius:50px;border:2px solid #E8C89A;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;cursor:pointer;background:#FFF5D0;color:#8B5E3C;transition:all .2s;white-space:nowrap;}
    .cat-tab.on{color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(196,30,58,.25);}

    /* GRID */
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px 12px 110px;}

    /* CARD */
    .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px rgba(59,26,10,.1);cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;border:1.5px solid #F0DEB4;}
    .card:active{transform:scale(.96);}
    .card-img{height:130px;display:flex;align-items:center;justify-content:center;font-size:62px;position:relative;overflow:hidden;}
    .card-badge{position:absolute;top:8px;left:8px;background:#C41E3A;color:#fff;font-size:9px;font-weight:900;padding:3px 8px;border-radius:50px;}
    .card-body{padding:10px 12px 12px;border-top:2px solid #FFF0C0;}
    .card-name{font-weight:800;font-size:13px;line-height:1.3;color:#3B1A0A;}
    .card-price{font-family:'Anton',sans-serif;font-size:20px;color:#C41E3A;letter-spacing:1px;margin-top:2px;}
    .card-tap{font-size:10px;color:#C8A96A;margin-top:3px;font-weight:700;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .card-tap{animation:pulse 2s infinite;}

    /* MODAL OVERLAY */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;}
    .modal{background:#fff;border-radius:28px 28px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding-bottom:32px;position:relative;}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .modal{animation:slideUp .32s cubic-bezier(.34,1.3,.64,1);}
    .modal-handle{width:40px;height:4px;background:#e0e0e0;border-radius:2px;margin:12px auto 0;}
    .close-x{position:absolute;top:14px;right:14px;width:44px;height:44px;background:#C41E3A;border:none;border-radius:50px;font-size:13px;font-weight:800;font-family:'Nunito',sans-serif;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;}

    /* PHOTO ZONE */
    .photo-zone{width:calc(100% - 32px);height:190px;border-radius:20px;margin:14px 16px 0;display:flex;align-items:center;justify-content:center;font-size:88px;cursor:pointer;position:relative;overflow:hidden;transition:transform .12s;user-select:none;}
    .photo-zone:active{transform:scale(.97);}
    .tap-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.88);backdrop-filter:blur(4px);padding:5px 14px;border-radius:50px;font-size:11px;font-weight:800;color:#2C1810;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.1);}

    /* EXPLOSION */
    /* EXPLOSION BUBBLES - circular ingredient cards */
    @keyframes flyOut{
      0%{transform:translate(-50%,-50%) scale(0) rotate(0deg);opacity:0;}
      35%{opacity:1;}
      100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(1) rotate(var(--rot));opacity:1;}
    }
    .ing-bubble{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:68px;height:68px;border-radius:50%;
      background:#fff;border:3px solid #F4C430;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      box-shadow:0 6px 20px rgba(0,0,0,.18);
      animation:flyOut .75s cubic-bezier(.34,1.56,.64,1) both;
      pointer-events:none;z-index:10;
      padding:4px;
    }
    .ing-emoji{font-size:30px;line-height:1;}
    .ing-label{font-size:8px;font-weight:800;text-align:center;color:#2C1810;line-height:1.2;margin-top:2px;max-width:60px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
    @keyframes shake{0%,100%{transform:scale(1) rotate(0)}20%{transform:scale(1.1) rotate(-5deg)}40%{transform:scale(1.1) rotate(5deg)}60%{transform:scale(1.05) rotate(-3deg)}80%{transform:scale(1.05) rotate(3deg)}}
    .boom{animation:shake .45s ease;}
    .expl-wrap{position:relative;height:190px;display:flex;align-items:center;justify-content:center;overflow:visible;margin:14px 16px 0;border-radius:20px;}

    /* INGREDIENTS GRID */
    .ing-grid{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px;margin-top:10px;}
    .ing-pill{background:#FFF5D0;border:1.5px solid #C41E3A;border-radius:50px;padding:5px 12px;font-size:13px;font-weight:600;}
    @keyframes popIn{0%{transform:scale(0);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
    .ing-pill{animation:popIn .35s cubic-bezier(.34,1.56,.64,1) both;}

    /* MODAL BODY */
    .mbody{padding:0 16px;}
    .mname{font-family:'Anton',sans-serif;font-size:30px;letter-spacing:1px;color:#C41E3A;margin-top:14px;}
    .mprice{font-family:'Anton',sans-serif;font-size:26px;color:#C41E3A;font-weight:900;}
    .mdesc{font-size:13px;color:#8B5E3C;line-height:1.55;margin-top:4px;}
    .sec-title{font-weight:900;font-size:14px;color:#C41E3A;margin:18px 0 8px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:1px;}

    /* QTY */
    .qty-row{display:flex;align-items:center;gap:16px;}
    .qty-btn{width:38px;height:38px;border-radius:50%;border:2.5px solid #C41E3A;background:#fff;color:#C41E3A;font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
    .qty-btn:active{background:#C41E3A;color:#fff;}
    .qty-num{font-size:26px;font-weight:900;min-width:32px;text-align:center;}

    /* ADICIONALES */
    .ad-group-title{font-size:12px;font-weight:800;color:#999;text-transform:uppercase;letter-spacing:1px;margin:12px 0 6px;}
    .ad-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#FFF5D0;border-radius:12px;margin-bottom:6px;border:2px solid transparent;gap:8px;}
    .ad-item.on{background:#FDECC0;border-color:#C41E3A;}
    .ad-left{flex:1;}
    .ad-name{font-weight:700;font-size:14px;}
    .ad-price{font-weight:600;color:#E8872A;font-size:12px;}
    .ad-qty-row{display:flex;align-items:center;gap:6px;flex-shrink:0;}
    .ad-qty-btn{width:28px;height:28px;border-radius:50%;border:2px solid #C41E3A;background:#fff;color:#C41E3A;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1;}
    .ad-qty-btn:active{background:#C41E3A;color:#fff;}
    .ad-qty-num{font-size:15px;font-weight:900;min-width:18px;text-align:center;}

    /* TEXTAREA */
    .obs{width:100%;padding:12px;border:2px solid #eee;border-radius:12px;font-family:'Nunito',sans-serif;font-size:14px;resize:none;outline:none;transition:border-color .2s;}
    .obs:focus{border-color:#C41E3A;}

    /* ADD BTN */
    .add-btn{width:100%;padding:16px;background:linear-gradient(135deg,#C41E3A,#A01530);color:#fff;border:none;border-radius:16px;font-family:'Anton',sans-serif;font-size:22px;letter-spacing:1px;cursor:pointer;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s;box-shadow:0 4px 14px rgba(196,30,58,.4);}
    .add-btn:active{transform:scale(.97);}

    /* INCENTIVO BANNER (domicilio gratis) */
    .incentivo-banner{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a6b3a;color:#fff;padding:11px 24px;border-radius:50px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;z-index:160;white-space:nowrap;box-shadow:0 4px 18px rgba(26,107,58,.45);pointer-events:none;animation:bannerIn .4s cubic-bezier(.34,1.3,.64,1);}
    @keyframes bannerIn{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

    /* SEL HINT (desliza para pedir) */
    .sel-hint{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(59,26,10,.88);backdrop-filter:blur(6px);color:#fff;padding:9px 20px;border-radius:50px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;z-index:260;white-space:nowrap;pointer-events:none;animation:bannerIn .35s cubic-bezier(.34,1.3,.64,1);}

    /* CART BAR */
    .cbar{position:fixed;bottom:0;left:0;right:0;padding:10px 14px;background:#fff;box-shadow:0 -4px 20px rgba(0,0,0,.12);z-index:150;border-top:3px solid #C41E3A;}
    .cbar-btn{width:100%;padding:14px 18px;background:linear-gradient(135deg,#C41E3A,#A01530);color:#fff;border:none;border-radius:16px;font-family:'Anton',sans-serif;font-size:20px;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 14px rgba(196,30,58,.4);}

    /* CART DRAWER */
    .cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:flex;align-items:flex-end;}
    .cart-draw{background:#fff;border-radius:28px 28px 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:0 16px 32px;animation:slideUp .3s ease-out;}
    .cart-title{font-family:'Anton',sans-serif;font-size:28px;color:#C41E3A;margin:18px 0 14px;letter-spacing:1px;}
    .ci-row{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #f2f2f2;align-items:flex-start;}
    .ci-emoji{font-size:30px;flex-shrink:0;}
    .ci-info{flex:1;}
    .ci-name{font-weight:800;font-size:14px;}
    .ci-detail{font-size:11px;color:#999;margin-top:2px;}
    .ci-price{font-weight:800;color:#C41E3A;font-size:15px;flex-shrink:0;}
    .ci-del{background:none;border:none;color:#ff5555;cursor:pointer;font-size:12px;margin-top:4px;font-weight:700;}
    .total-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:2.5px solid #eee;margin-top:6px;}
    .total-label{font-weight:900;font-size:18px;}
    .total-price{font-family:'Anton',sans-serif;font-size:30px;color:#C41E3A;}
    .wa-btn{width:100%;padding:16px;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;border:none;border-radius:16px;font-family:'Anton',sans-serif;font-size:22px;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;box-shadow:0 4px 14px rgba(37,211,102,.4);transition:transform .15s;}
    .wa-btn:active{transform:scale(.97);}
    .empty-cart{text-align:center;padding:40px 20px;color:#bbb;}

    /* ARMA TU CREPE */
    .arma-wrap{padding:14px 12px 120px;}
    .arma-hero{background:linear-gradient(135deg,#C41E3A22,#E8872A33);border-radius:20px;padding:16px;margin-bottom:16px;}
    .arma-title{font-family:'Anton',sans-serif;font-size:28px;color:#C41E3A;letter-spacing:1px;}
    .pill-sel{display:inline-flex;align-items:center;gap:4px;padding:8px 13px;border-radius:50px;border:2px solid #ddd;background:#fff;color:#555;cursor:pointer;margin:0 6px 6px 0;font-weight:700;font-size:13px;transition:all .2s;}
    .pill-sel.on{background:#C41E3A;border-color:#C41E3A;color:#fff;}
    .arma-summary{background:#FFF5D0;border-radius:16px;padding:14px;margin:14px 0;}

    /* BEBIDAS */
    .beb-wrap{padding:14px 12px 120px;}
    .beb-item{display:flex;justify-content:space-between;align-items:center;padding:13px;background:#fff;border-radius:14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;transition:transform .15s;}
    .beb-item:active{transform:scale(.97);}
    .beb-name{font-weight:800;font-size:14px;}
    .beb-desc{font-size:11px;color:#999;margin-top:2px;}

    /* SEARCH BAR */
    .search-wrap{background:#fff;padding:8px 12px;border-bottom:2px solid #F0DEB4;position:sticky;top:130px;z-index:85;}
    .search-inner{position:relative;}
    .search-input{width:100%;padding:10px 36px 10px 40px;border:2px solid #E8C89A;border-radius:50px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;color:#3B1A0A;background:#FFF5D0;outline:none;transition:border-color .2s;}
    .search-input:focus{border-color:#C41E3A;background:#fff;}
    .search-input::placeholder{color:#C8A96A;font-weight:600;}
    .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;}
    .search-clear{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:16px;cursor:pointer;color:#aaa;padding:4px;}
    .no-results{text-align:center;padding:48px 20px;color:#C8A96A;}
    .plus-circle{background:#C41E3A;color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}

    /* SPLASH SCREEN */
    .splash{position:fixed;inset:0;background:#fff;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;overflow:hidden;}
    @keyframes splashFadeOut{0%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
    .splash.out{animation:splashFadeOut .5s ease forwards;pointer-events:none;}
    @keyframes logoIn{0%{opacity:0;transform:translateY(-20px)}100%{opacity:1;transform:translateY(0)}}
    .splash-logo{animation:logoIn .6s .2s ease both;text-align:center;}
    @keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-14px) rotate(1.5deg)}}
    .splash-logo-img{animation:logoFloat 3.2s ease-in-out infinite;display:block;}
    @keyframes videoIn{0%{opacity:0;transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
    .splash-video-wrap{width:calc(100vw - 32px);max-width:380px;border-radius:20px;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.4);animation:videoIn .7s .5s ease both;background:#000;position:relative;}
    .splash-video-wrap video{width:100%;display:block;max-height:55vh;object-fit:cover;}
    .splash-video-wrap iframe{width:100%;border:none;aspect-ratio:9/16;display:block;max-height:55vh;}
    @keyframes btnIn{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
    .splash-btn{animation:btnIn .5s 1s ease both;background:#F4C430;border:none;border-radius:50px;padding:14px 36px;font-family:'Anton',sans-serif;font-size:22px;letter-spacing:1px;color:#2C1810;cursor:pointer;margin-top:20px;box-shadow:0 4px 16px rgba(0,0,0,.3);transition:transform .15s;}
    .splash-btn:active{transform:scale(.95);}
    .splash-tagline{font-size:11px;color:rgba(255,255,255,.7);letter-spacing:2px;text-transform:uppercase;margin-top:6px;font-weight:700;animation:logoIn .6s .4s ease both;}
  </style>

const fmtP = p => '$' + p.toLocaleString('es-CO');
const catColor = id => (CATEGORIES.find(c=>c.id===id)||{color:'#C41E3A'}).color;
const catEmoji = id => (CATEGORIES.find(c=>c.id===id)||{emoji:'🥞'}).emoji;

// ============================================================
// INGREDIENT EXPLOSION
// ============================================================
// Parse "🍗 Pollo desmechado" → { emoji: "🍗", label: "Pollo desmechado" }
function parseIng(ing) {
  const m = ing.match(/^([\p{Emoji_Presentation}\p{Extended_Pictographic}]+)\s+(.+)$/u);
  if (m) return { emoji: m[1].trim(), label: m[2].trim() };
  return { emoji: '🥞', label: ing };
}

// Category-based colors for ingredient bubbles
const ING_COLORS = [
  '#FFF0E0','#E8F5FF','#F0FFE8','#FFF0F5','#F5F0FF',
  '#FFFBE0','#E0F5FF','#FFE8F0','#E8FFE8','#FFE0E0',
];

function Explosion({ingredients, onDone, centerEmoji, centerPhoto}) {
  useEffect(() => {
    const t = setTimeout(onDone, 1600);
    return () => clearTimeout(t);
  }, []);

  const total = ingredients.length;
  // Spiral outward with varied distances for more dramatic effect
  const positions = ingredients.map((_, i) => {
    const angle = (2 * Math.PI * i / total) - Math.PI / 2;
    const dist = 100 + (i % 3) * 20; // 100–140px
    return {
      tx: Math.cos(angle) * dist,
      ty: Math.sin(angle) * dist,
      rot: ((i * 47) % 40 - 20) + 'deg',
      delay: (i * 0.07) + 's',
      color: ING_COLORS[i % ING_COLORS.length],
    };
  });

  return (
    <div className="expl-wrap" style={{height:230}}>
      {/* Center: photo circle or emoji shaking */}
      {centerEmoji
        ? <span className="boom" style={{fontSize:72, position:'absolute', zIndex:5}}>{centerEmoji}</span>
        : centerPhoto
          ? <img className="boom" src={centerPhoto} alt="" style={{width:80,height:80,borderRadius:'50%',objectFit:'cover',position:'absolute',zIndex:5,border:'3px solid #F4C430',boxShadow:'0 4px 20px rgba(0,0,0,.25)'}}/>
          : <span className="boom" style={{fontSize:72, position:'absolute', zIndex:5}}>🥞</span>
      }
      {ingredients.map((ing, i) => {
        const {emoji, label} = parseIng(ing);
        return (
          <div
            key={i}
            className="ing-bubble"
            style={{
              '--tx': positions[i].tx + 'px',
              '--ty': positions[i].ty + 'px',
              '--rot': positions[i].rot,
              animationDelay: positions[i].delay,
              background: positions[i].color,
              borderColor: '#F4C430',
            }}
          >
            <div className="ing-emoji">{emoji}</div>
            <div className="ing-label">{label}</div>
          </div>
        );
      })}
    </div>
  );
}

function ProductModal({item, onClose, onAdd}) {
  const [phase, setPhase] = useState('photo'); // photo | exploding | revealed
  const [qty, setQty] = useState(1);
  const [ads, setAds] = useState({});
  const [obs, setObs] = useState('');
  const [retirados, setRetirados] = useState({});
  const [showRetiro, setShowRetiro] = useState(false);
  const [variant, setVariant] = useState(item.variants ? item.variants[0] : null);
  const [mods, setMods] = useState(() => {
    const m = {};
    (item.modifiers||[]).forEach(mod => { m[mod.name] = mod.default || mod.options[0]; });
    return m;
  });

  const basePrice = variant ? variant.price : item.price;

  const color = catColor(item.cat);
  const emoji = catEmoji(item.cat);
  const ADICIONALES = getAdicionales(item.cat);

  const changeAdQty = (ad, delta) => {
    setAds(prev => {
      const cur = prev[ad.name]?.qty || 0;
      const next = Math.max(0, cur + delta);
      if (next === 0) { const n={...prev}; delete n[ad.name]; return n; }
      return {...prev, [ad.name]: {...ad, qty: next}};
    });
  };

  const adsTotal = Object.values(ads).reduce((s,a)=>s+(a.price*(a.qty||1)), 0);
  const total = (basePrice + adsTotal) * qty;

  const handleAdd = () => {
    const retiradosList = Object.keys(retirados).filter(k=>retirados[k]);
    const modsList = Object.entries(mods).map(([k,v])=>v).join(', ');
    const obsFinal = [obs, retiradosList.length ? `SIN: ${retiradosList.join(', ')}` : '', modsList].filter(Boolean).join(' | ');
    const itemName = variant ? `${item.name} (${variant.name})` : item.name;
    onAdd({item:{...item,name:itemName}, qty, additions:Object.values(ads), obs:obsFinal, totalPrice:total});
    onClose();
  };

  return (
    <div className="overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-handle"/>
        <button className="close-x" onClick={onClose}>← Volver</button>

        {/* PHOTO / EXPLOSION / REVEALED */}
        {phase === 'photo' && (
          <div
            className="photo-zone"
            style={item.photo ? {background:'#000'} : {background:`linear-gradient(135deg,${color}22,${color}55)`}}
            onClick={() => setPhase('exploding')}
          >
            {item.photo
              ? <img src={item.photo} alt={item.name} style={{width:'100%',height:'100%',objectFit:'cover',position:'absolute',inset:0,borderRadius:20,opacity:.92}}/>
              : <span>{emoji}</span>
            }
            <div className="tap-hint" style={{zIndex:2,position:'relative'}}>👆 Toca para ver los ingredientes</div>
          </div>
        )}
        {phase === 'exploding' && (
          <Explosion
            ingredients={item.ingredients}
            onDone={() => setPhase('revealed')}
            centerEmoji={item.photo ? null : emoji}
            centerPhoto={item.photo || null}
          />
        )}
        {phase === 'revealed' && (
          <div style={{paddingTop:14}}>
            <div style={{textAlign:'center',fontSize:13,fontWeight:800,color:'#aaa',marginBottom:8}}>
              ✨ Ingredientes de tu crepe
            </div>
            <div className="ing-grid">
              {item.ingredients.map((ing,i) => {
                const {emoji:e, label} = parseIng(ing);
                return (
                  <div key={i} className="ing-pill" style={{animationDelay:(i*0.07)+'s',display:'flex',alignItems:'center',gap:5}}>
                    <span style={{fontSize:18}}>{e}</span>
                    <span style={{fontSize:12,fontWeight:700}}>{label}</span>
                  </div>
                );
              })}
            </div>
            {/* BOTÓN RETIRAR INGREDIENTES */}
            <div style={{padding:'0 16px',marginTop:10}}>
              <button
                onClick={()=>setShowRetiro(r=>!r)}

                  width:'100%',padding:'10px 14px',
                  background: showRetiro ? '#FFF0F0' : '#FFF6E0',
                  border:`2px solid ${showRetiro ? '#C41E3A' : '#F4C430'}`,
                  borderRadius:12,cursor:'pointer',
                  display:'flex',alignItems:'center',justifyContent:'space-between',
                  fontFamily:"'Nunito',sans-serif",fontWeight:800,fontSize:13,color:'#2C1810'
                }}
              >
                <span>🚫 ¿Deseas retirar algún ingrediente?</span>
                <span style={{fontSize:16}}>{showRetiro ? '▲' : '▼'}</span>
              </button>

              {showRetiro && (
                <div style={{background:'#FFF0F0',borderRadius:'0 0 12px 12px',padding:'10px 12px',border:'2px solid #C41E3A',borderTop:'none',display:'flex',flexWrap:'wrap',gap:8}}>

              <div style={{display:'flex',flexDirection:'column',gap:8}}>
                {item.variants.map((v,i) => (
                  <div
                    key={i}
                    onClick={()=>setVariant(v)}
                    style={{
                      display:'flex',justifyContent:'space-between',alignItems:'center',
                      padding:'11px 14px',borderRadius:12,cursor:'pointer',
                      background: variant?.name===v.name ? '#FFF0C0' : '#FFF5D0',
                      border: `2.5px solid ${variant?.name===v.name ? '#C41E3A' : '#E8C89A'}`,
                      transition:'all .15s'
                    }}
                  >
                    <div style={{display:'flex',alignItems:'center',gap:8}}>
                      <div style={{
                        width:20,height:20,borderRadius:'50%',flexShrink:0,
                        border:`2.5px solid ${variant?.name===v.name ? '#C41E3A' : '#C8A96A'}`,
                        background: variant?.name===v.name ? '#C41E3A' : 'transparent',

const VIDEO_SRC = null;

function Splash({onEnter}) {
  const [leaving, setLeaving] = useState(false);
  const [countdown, setCountdown] = useState(4);

  const handleEnter = () => {
    setLeaving(true);
    setTimeout(onEnter, 450);
  };

  // Auto-advance after 6 seconds
  useEffect(() => {
    const interval = setInterval(() => {
      setCountdown(c => {
        if (c <= 1) { clearInterval(interval); handleEnter(); return 0; }
        return c - 1;
      });
    }, 1000);
    return () => clearInterval(interval);
  }, []);

  const embedSrc = VIDEO_DRIVE_ID
    ? `https://drive.google.com/file/d/${VIDEO_DRIVE_ID}/preview`
    : null;

  return (
    <div className={`splash ${leaving ? 'out' : ''}`} style={{padding:'24px 16px',gap:14,background:'#fff'}}>

      <svg style={{position:'absolute',bottom:60,left:0,width:120,opacity:.07}} viewBox="0 0 200 200"><path d="M0 180 Q30 140 60 160 Q30 190 0 180Z" fill="#3B1A0A"/></svg>

          background:'#000',

    cart.forEach((c,i) => {
      lines.push(`*${i+1}. ${c.item.name}* ×${c.qty}`);
      if (c.additions.length) lines.push(`   ➕ ${c.additions.map(a=>`${a.name}${a.qty>1?' ×'+a.qty:''}`).join(', ')}`);
      if (c.obs) lines.push(`   📝 ${c.obs}`);
      lines.push(`   💰 ${fmtP(c.totalPrice)}\n`);

    lines.push(`*TOTAL: ${fmtP(total)}*`);

    <div className="cart-overlay" onClick={e=>e.target===e.currentTarget && onClose()}>

                <div className="ci-info">
                  <div className="ci-name">{c.item.name} ×{c.qty}</div>

function ArmaTuCrepe({onAdd}) {
  const [carnes, setCarnes] = useState({});

  const [verduras, setVerduras] = useState({});
  const [frutas, setFrutas] = useState({});
  const [dulces, setDulces] = useState({});
  const [qty, setQty] = useState(1);
  const [obs, setObs] = useState('');

  const toggle = (setter, item) => setter(p => {
    if (p[item.name]) { const n={...p}; delete n[item.name]; return n; }
    return {...p, [item.name]:item};
  });

  const all = {...carnes,...quesos,...verduras,...frutas,...dulces};
  const extras = Object.values(all).reduce((s,a)=>s+a.price,0);
  const total = (ARMA_BASE + extras) * qty;

  const Pill = ({item, sel, onToggle}) => (
    <div onClick={()=>onToggle(item)} className={`pill-sel ${sel?'on':''}`}>
      {item.name} <span style={{opacity:.7,fontSize:11}}>+${(item.price/1000).toFixed(1)}k</span>
    </div>
  );

  const handleAdd = () => {
    if (!Object.keys(all).length) { alert('¡Selecciona al menos un ingrediente!'); return; }
    onAdd({
      item:{id:'arma',name:'Arma Tu Crepe',cat:'armatu',price:ARMA_BASE},
      qty, additions:Object.values(all), obs, totalPrice:total,
    });
  };

  return (
    <div className="arma-wrap">
      <div className="arma-hero">
        <div className="arma-title">🛠️ Arma Tu Crepe</div>
        <div style={{fontSize:14,color:'#777'}}>Masa clásica — {fmtP(ARMA_BASE)} · Elige tus ingredientes</div>
      </div>

      <div className="sec-title">🥩 Carnes</div>
      <div style={{display:'flex',flexWrap:'wrap'}}>
        {ARMA_CARNES.map(c=><Pill key={c.name} item={c} sel={!!carnes[c.name]} onToggle={i=>toggle(setCarnes,i)}/>)}
      </div>

      <div className="sec-title">🧀 Quesos y Salsas</div>
      <div style={{display:'flex',flexWrap:'wrap'}}>
        {ARMA_QUESOS.map(c=><Pill key={c.name} item={c} sel={!!quesos[c.name]} onToggle={i=>toggle(setQuesos,i)}/>)}
      </div>

      <div className="sec-title">🥬 Verduras</div>
      <div style={{display:'flex',flexWrap:'wrap'}}>
        {ARMA_VERDURAS.map(c=><Pill key={c.name} item={c} sel={!!verduras[c.name]} onToggle={i=>toggle(setVerduras,i)}/>)}
      </div>

      <div className="sec-title">🍓 Frutas</div>
      <div style={{display:'flex',flexWrap:'wrap'}}>
        {ARMA_FRUTAS.map(c=><Pill key={c.name} item={c} sel={!!frutas[c.name]} onToggle={i=>toggle(setFrutas,i)}/>)}
      </div>

      <div className="sec-title">🍫 Dulces</div>
      <div style={{display:'flex',flexWrap:'wrap'}}>
        {ARMA_DULCES.map(c=><Pill key={c.name} item={c} sel={!!dulces[c.name]} onToggle={i=>toggle(setDulces,i)}/>)}
      </div>

      <div className="arma-summary">
        <div style={{fontWeight:800,fontSize:14,marginBottom:6}}>Tu selección:</div>
        {!Object.keys(all).length
          ? <div style={{color:'#bbb',fontSize:13}}>¡Elige tus ingredientes arriba!</div>
          : <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
              {Object.values(all).map(a=>(
                <span key={a.name} style={{background:'#fff',border:'1.5px solid #F4C430',borderRadius:50,padding:'4px 10px',fontSize:12,fontWeight:700}}>{a.name}</span>

      <textarea className="obs" rows={2} style={{marginBottom:4}} placeholder="Alguna preferencia especial..." value={obs} onChange={e=>setObs(e.target.value)}/>

      <button className="add-btn" style={{marginTop:14}} onClick={handleAdd}>
        🛒 Agregar al pedido — {fmtP(total)}
      </button>
    </div>
  );
}

          <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:10}}>

function App() {
  const [showSplash, setShowSplash] = useState(() => !sessionStorage.getItem('lc_entered'));

  const [cat, setCat] = useState('favoritas');
  const [sel, setSel] = useState(null);
  const [cart, setCart] = useState(() => {
    try { return JSON.parse(localStorage.getItem('lc_cart')||'[]'); } catch { return []; }
  });
  const [showCart, setShowCart] = useState(false);
  const [bounce, setBounce] = useState(false);
  const [incentivoBanner, setIncentivoBanner] = useState('');
  const [selHint, setSelHint] = useState(false);
  const catRef = useRef(null);

  useEffect(() => {
    localStorage.setItem('lc_cart', JSON.stringify(cart));
  }, [cart]);

  // Banner incentivo domicilio gratis
  useEffect(() => {
    if (cart.length === 0) { setIncentivoBanner(''); return; }
    const total = cart.reduce((s, c) => s + c.totalPrice, 0);
    if (total < 60000) { setIncentivoBanner(''); return; }
    const msg = total >= 100000
      ? '🚀 ¡Domicilio GRATIS en tu pedido!'
      : `🎉 ¡Te faltan $${(100000 - total).toLocaleString('es-CO')} para domicilio GRATIS!`;
    setIncentivoBanner(msg);
    const t = setTimeout(() => setIncentivoBanner(''), 4000);
    return () => clearTimeout(t);
  }, [cart]);

  // Hint al abrir modal de producto
  useEffect(() => {
    if (!sel) return;
    setSelHint(true);
    const t = setTimeout(() => setSelHint(false), 3000);
    return () => clearTimeout(t);
  }, [sel]);

  const playCartSound = () => {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      // Fun "pop" + ascending ding sound
      const playTone = (freq, start, dur, type='sine') => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = type; o.frequency.setValueAtTime(freq, ctx.currentTime + start);
        o.frequency.exponentialRampToValueAtTime(freq*1.5, ctx.currentTime + start + dur*0.5);
        g.gain.setValueAtTime(0.3, ctx.currentTime + start);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + dur);
        o.start(ctx.currentTime + start);
        o.stop(ctx.currentTime + start + dur);
      };
      playTone(400, 0,    0.08, 'square');
      playTone(600, 0.07, 0.08, 'square');
      playTone(900, 0.14, 0.15, 'sine');
    } catch(e) {}
  };

  const addToCart = (item) => {
    setCart(p => [...p, item]);
    playCartSound();
    setBounce(true);
    setTimeout(()=>setBounce(false), 400);
  };

  const removeFromCart = (idx) => setCart(p => p.filter((_,i)=>i!==idx));

  const handleEnter = () => { sessionStorage.setItem('lc_entered','1'); setShowSplash(false); };
  if (showSplash) return <Splash onEnter={handleEnter}/>;

  const searchQ = search.trim().toLowerCase();

    ? ITEMS.filter(i => i.name.toLowerCase().includes(searchQ) || (i.desc||'').toLowerCase().includes(searchQ))
    : [];

    setCat(id);
    // Scroll the cat tab into view

      if (catRef.current) {
        const btn = catRef.current.querySelector(`.cat-tab.on`);
        if (btn) btn.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
      }
    }, 50);
  };

  return (
    <>
      {/* STICKY NAV: header + category bar como una unidad */}

        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <img
            src="uploads/logo-9cc2bf2c.jpeg"

          />

          </div>
        </div>

              ? <div style={{display:'flex',alignItems:'center',background:'#FFF5D0',border:'2px solid #C41E3A',borderRadius:50,padding:'5px 10px 5px 12px',gap:6}}>
                  <span style={{fontSize:14}}>🔍</span>
                  <input
                    autoFocus
                    style={{border:'none',background:'transparent',fontFamily:"'Nunito',sans-serif",fontWeight:700,fontSize:13,color:'#3B1A0A',outline:'none',width:120}}
                    placeholder="Buscar..."

            onClick={()=>switchCat(c.id)}
          >
            {c.emoji} {c.name}
          </button>
        ))}
      </div>}
      </div>{/* /sticky-nav */}

      {/* RESULTADOS DE BÚSQUEDA */}
      {searchQ.length > 1 ? (
        <div style={{padding:'14px 12px 110px'}}>
          {searchResults.length === 0 ? (
            <div className="no-results">
              <div style={{fontSize:48}}>🥞</div>
              <div style={{fontWeight:800,fontSize:16,marginTop:10,color:'#3B1A0A'}}>Sin resultados para "{search}"</div>
              <div style={{fontSize:13,marginTop:4,color:'#C8A96A'}}>Intenta con otro nombre o ingrediente</div>
            </div>
          ) : (
            <>
              <div style={{fontSize:12,fontWeight:800,color:'#C41E3A',textTransform:'uppercase',letterSpacing:1,marginBottom:10}}>
                {searchResults.length} resultado{searchResults.length!==1?'s':''} • "{search}"
              </div>
              <div className="grid" style={{padding:0,paddingBottom:110}}>
                {searchResults.map(item => (
                  <ProductCard key={item.id} item={item} onSelect={setSel}/>
                ))}
              </div>
            </>
          )}
        </div>
      ) : (
        <>
          {/* CONTENT */}
          {cat === 'armatu' ? (
            <ArmaTuCrepe onAdd={addToCart}/>
          ) : cat === 'bebidas' ? (
            <Bebidas onAdd={addToCart}/>
          ) : (
            <div className="grid">
              {items.map(item => (
                <ProductCard key={item.id} item={item} onSelect={setSel}/>
              ))}
            </div>
          )}
        </>
      )}

      {/* CART BAR */}
      {cart.length > 0 && (
        <div className="cbar">
          <button className="cbar-btn" onClick={()=>setShowCart(true)}>
            <span>{cart.length} {cart.length===1?'producto':'productos'}</span>
            <span>Ver pedido →</span>
            <span>{fmtP(cartTotal)}</span>
          </button>
        </div>
      )}

      {/* INCENTIVO BANNER */}
      {incentivoBanner && <div className="incentivo-banner">{incentivoBanner}</div>}

      {/* SEL HINT */}
      {selHint && <div className="sel-hint">⬆️ Desliza hacia arriba para pedir</div>}

      {/* MODALS */}
      {sel && <ProductModal item={sel} onClose={()=>setSel(null)} onAdd={addToCart}/>}
      {showCart && <CartDrawer cart={cart} onClose={()=>setShowCart(false)} onRemove={removeFromCart} onSend={()=>{setCart([]);setShowCart(false);}}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

    <rect x="0" y="0" width="400" height="60" fill="#C41E3A"/>
    <text x="200" y="42" text-anchor="middle" font-size="36" font-weight="bold" fill="#fff" font-family="sans-serif">LAS CREPES</text>
    <text x="200" y="160" text-anchor="middle" font-size="90" font-family="sans-serif">🥞</text>
    <text x="200" y="230" text-anchor="middle" font-size="18" fill="#8B5E3C" font-family="sans-serif">Carta Digital</text>
  </svg>

</body>
