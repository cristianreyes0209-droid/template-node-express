<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Las Crepes 🥞</title>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{background:#FFF5D0;font-family:'Nunito',sans-serif;color:#3B1A0A;min-height:100vh;overflow-x:hidden;}

    /* HEADER */
    .hdr{background:#fff;color:#3B1A0A;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 3px 14px rgba(0,0,0,.12);border-bottom:4px solid #C41E3A;}
    .hdr-logo{font-family:'Anton',sans-serif;font-size:26px;letter-spacing:2px;color:#C41E3A;line-height:1.1;}
    .hdr-sub{font-size:9px;color:#8B5E3C;margin-top:1px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;}
    .cart-btn{background:#C41E3A;border:none;border-radius:50px;padding:10px 18px;font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;cursor:pointer;color:#fff;display:flex;align-items:center;gap:6px;transition:transform .15s;box-shadow:0 2px 8px rgba(196,30,58,.3);}
    .cart-btn:active{transform:scale(.93);}
    .cart-count{background:#F4C430;color:#2C1810;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;}
    @keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
    .cbounce{animation:bounce .35s ease;}

    /* HERO BANNER */
    .hero{background:linear-gradient(135deg,#C41E3A 0%,#E8872A 100%);color:#fff;padding:18px 20px 16px;text-align:center;}
    .hero-title{font-family:'Anton',sans-serif;font-size:36px;letter-spacing:2px;text-shadow:2px 2px 0 rgba(0,0,0,.2);}
    .hero-sub{font-size:13px;opacity:.85;margin-top:2px;}

    /* STICKY NAV WRAPPER — header + cats como una sola unidad sticky */
    .sticky-nav{position:sticky;top:0;z-index:100;}

    /* CATEGORY TABS */
    .cats{background:#fff;overflow-x:auto;padding:10px 12px;display:flex;gap:8px;scrollbar-width:none;box-shadow:0 2px 10px rgba(0,0,0,.08);}
    .cats::-webkit-scrollbar{display:none;}
    .cat-tab{flex-shrink:0;padding:8px 16px;border-radius:50px;border:2px solid #E8C89A;font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;cursor:pointer;background:#FFF5D0;color:#8B5E3C;transition:all .2s;white-space:nowrap;}
    .cat-tab.on{color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(196,30,58,.25);}

    /* GRID */
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:14px 12px 110px;}

    /* CARD */
    .card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px rgba(59,26,10,.1);cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;border:1.5px solid #F0DEB4;}
    .card:active{transform:scale(.96);}
    .card-img{height:130px;display:flex;align-items:center;justify-content:center;font-size:62px;position:relative;overflow:hidden;}
    .card-badge{position:absolute;top:8px;left:8px;background:#C41E3A;color:#fff;font-size:9px;font-weight:900;padding:3px 8px;border-radius:50px;}
    .card-body{padding:10px 12px 12px;border-top:2px solid #FFF0C0;}
    .card-name{font-weight:800;font-size:13px;line-height:1.3;color:#3B1A0A;}
    .card-price{font-family:'Anton',sans-serif;font-size:20px;color:#C41E3A;letter-spacing:1px;margin-top:2px;}
    .card-tap{font-size:10px;color:#C8A96A;margin-top:3px;font-weight:700;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    .card-tap{animation:pulse 2s infinite;}

    /* MODAL OVERLAY */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;}
    .modal{background:#fff;border-radius:28px 28px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding-bottom:32px;position:relative;}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .modal{animation:slideUp .32s cubic-bezier(.34,1.3,.64,1);}
    .modal-handle{width:40px;height:4px;background:#e0e0e0;border-radius:2px;margin:12px auto 0;}
    .close-x{position:absolute;top:14px;right:14px;width:44px;height:44px;background:#C41E3A;border:none;border-radius:50px;font-size:13px;font-weight:800;font-family:'Nunito',sans-serif;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;}

    /* PHOTO ZONE */
    .photo-zone{width:calc(100% - 32px);height:190px;border-radius:20px;margin:14px 16px 0;display:flex;align-items:center;justify-content:center;font-size:88px;cursor:pointer;position:relative;overflow:hidden;transition:transform .12s;user-select:none;}
    .photo-zone:active{transform:scale(.97);}
    .tap-hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.88);backdrop-filter:blur(4px);padding:5px 14px;border-radius:50px;font-size:11px;font-weight:800;color:#2C1810;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.1);}

    /* EXPLOSION */
    /* EXPLOSION BUBBLES - circular ingredient cards */
    @keyframes flyOut{
      0%{transform:translate(-50%,-50%) scale(0) rotate(0deg);opacity:0;}
      35%{opacity:1;}
      100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(1) rotate(var(--rot));opacity:1;}
    }
    .ing-bubble{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:68px;height:68px;border-radius:50%;
      background:#fff;border:3px solid #F4C430;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      box-shadow:0 6px 20px rgba(0,0,0,.18);
      animation:flyOut .75s cubic-bezier(.34,1.56,.64,1) both;
      pointer-events:none;z-index:10;
      padding:4px;
    }
    .ing-emoji{font-size:30px;line-height:1;}
    .ing-label{font-size:8px;font-weight:800;text-align:center;color:#2C1810;line-height:1.2;margin-top:2px;max-width:60px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
    @keyframes shake{0%,100%{transform:scale(1) rotate(0)}20%{transform:scale(1.1) rotate(-5deg)}40%{transform:scale(1.1) rotate(5deg)}60%{transform:scale(1.05) rotate(-3deg)}80%{transform:scale(1.05) rotate(3deg)}}
    .boom{animation:shake .45s ease;}
    .expl-wrap{position:relative;height:190px;display:flex;align-items:center;justify-content:center;overflow:visible;margin:14px 16px 0;border-radius:20px;}

    /* INGREDIENTS GRID */
    .ing-grid{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px;margin-top:10px;}
    .ing-pill{background:#FFF5D0;border:1.5px solid #C41E3A;border-radius:50px;padding:5px 12px;font-size:13px;font-weight:600;}
    @keyframes popIn{0%{transform:scale(0);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
    .ing-pill{animation:popIn .35s cubic-bezier(.34,1.56,.64,1) both;}

    /* MODAL BODY */
    .mbody{padding:0 16px;}
    .mname{font-family:'Anton',sans-serif;font-size:30px;letter-spacing:1px;color:#C41E3A;margin-top:14px;}
    .mprice{font-family:'Anton',sans-serif;font-size:26px;color:#C41E3A;font-weight:900;}
    .mdesc{font-size:13px;color:#8B5E3C;line-height:1.55;margin-top:4px;}
    .sec-title{font-weight:900;font-size:14px;color:#C41E3A;margin:18px 0 8px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:1px;}

    /* QTY */
    .qty-row{display:flex;align-items:center;gap:16px;}
    .qty-btn{width:38px;height:38px;border-radius:50%;border:2.5px solid #C41E3A;background:#fff;color:#C41E3A;font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;}
    .qty-btn:active{background:#C41E3A;color:#fff;}
    .qty-num{font-size:26px;font-weight:900;min-width:32px;text-align:center;}

    /* ADICIONALES */
    .ad-group-title{font-size:12px;font-weight:800;color:#999;text-transform:uppercase;letter-spacing:1px;margin:12px 0 6px;}
    .ad-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:#FFF5D0;border-radius:12px;margin-bottom:6px;border:2px solid transparent;gap:8px;}
    .ad-item.on{background:#FDECC0;border-color:#C41E3A;}
    .ad-left{flex:1;}
    .ad-name{font-weight:700;font-size:14px;}
    .ad-price{font-weight:600;color:#E8872A;font-size:12px;}
    .ad-qty-row{display:flex;align-items:center;gap:6px;flex-shrink:0;}
    .ad-qty-btn{width:28px;height:28px;border-radius:50%;border:2px solid #C41E3A;background:#fff;color:#C41E3A;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1;}
    .ad-qty-btn:active{background:#C41E3A;color:#fff;}
    .ad-qty-num{font-size:15px;font-weight:900;min-width:18px;text-align:center;}

    /* TEXTAREA */
    .obs{width:100%;padding:12px;border:2px solid #eee;border-radius:12px;font-family:'Nunito',sans-serif;font-size:14px;resize:none;outline:none;transition:border-color .2s;}
    .obs:focus{border-color:#C41E3A;}

    /* ADD BTN */
    .add-btn{width:100%;padding:16px;background:linear-gradient(135deg,#C41E3A,#A01530);color:#fff;border:none;border-radius:16px;font-family:'Anton',sans-serif;font-size:22px;letter-spacing:1px;cursor:pointer;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s;box-shadow:0 4px 14px rgba(196,30,58,.4);}
    .add-btn:active{transform:scale(.97);}

    /* INCENTIVO BANNER (domicilio gratis) */
    .incentivo-banner{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a6b3a;color:#fff;padding:11px 24px;border-radius:50px;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;z-index:160;white-space:nowrap;box-shadow:0 4px 18px rgba(26,107,58,.45);pointer-events:none;animation:bannerIn .4s cubic-bezier(.34,1.3,.64,1);}
    @keyframes bannerIn{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

    /* SEL HINT (desliza para pedir) */
    .sel-hint{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(59,26,10,.88);backdrop-filter:blur(6px);color:#fff;padding:9px 20px;border-radius:50px;font-family:'Nunito',sans-serif;font-size:12px;font-weight:800;z-index:260;white-space:nowrap;pointer-events:none;animation:bannerIn .35s cubic-bezier(.34,1.3,.64,1);}

    /* CART BAR */
    .cbar{position:fixed;bottom:0;left:0;right:0;padding:10px 14px;background:#fff;box-shadow:0 -4px 20px rgba(0,0,0,.12);z-index:150;border-top:3px solid #C41E3A;}
    .cbar-btn{width:100%;padding:14px 18px;background:linear-gradient(135deg,#C41E3A,#A01530);color:#fff;border:none;border-radius:16px;font-family:'Anton',sans-serif;font-size:20px;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 14px rgba(196,30,58,.4);}

    /* CART DRAWER */
    .cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:flex;align-items:flex-end;}
    .cart-draw{background:#fff;border-radius:28px 28px 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:0 16px 32px;animation:slideUp .3s ease-out;}
    .cart-title{font-family:'Anton',sans-serif;font-size:28px;color:#C41E3A;margin:18px 0 14px;letter-spacing:1px;}
    .ci-row{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #f2f2f2;align-items:flex-start;}
    .ci-emoji{font-size:30px;flex-shrink:0;}
    .ci-info{flex:1;}
    .ci-name{font-weight:800;font-size:14px;}
    .ci-detail{font-size:11px;color:#999;margin-top:2px;}
    .ci-price{font-weight:800;color:#C41E3A;font-size:15px;flex-shrink:0;}
    .ci-del{background:none;border:none;color:#ff5555;cursor:pointer;font-size:12px;margin-top:4px;font-weight:700;}
    .total-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:2.5px solid #eee;margin-top:6px;}
    .total-label{font-weight:900;font-size:18px;}
    .total-price{font-family:'Anton',sans-serif;font-size:30px;color:#C41E3A;}
    .wa-btn{width:100%;padding:16px;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;border:none;border-radius:16px;font-family:'Anton',sans-serif;font-size:22px;letter-spacing:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;box-shadow:0 4px 14px rgba(37,211,102,.4);transition:transform .15s;}
    .wa-btn:active{transform:scale(.97);}
    .empty-cart{text-align:center;padding:40px 20px;color:#bbb;}

    /* ARMA TU CREPE */
    .arma-wrap{padding:14px 12px 120px;}
    .arma-hero{background:linear-gradient(135deg,#C41E3A22,#E8872A33);border-radius:20px;padding:16px;margin-bottom:16px;}
    .arma-title{font-family:'Anton',sans-serif;font-size:28px;color:#C41E3A;letter-spacing:1px;}
    .pill-sel{display:inline-flex;align-items:center;gap:4px;padding:8px 13px;border-radius:50px;border:2px solid #ddd;background:#fff;color:#555;cursor:pointer;margin:0 6px 6px 0;font-weight:700;font-size:13px;transition:all .2s;}
    .pill-sel.on{background:#C41E3A;border-color:#C41E3A;color:#fff;}
    .arma-summary{background:#FFF5D0;border-radius:16px;padding:14px;margin:14px 0;}

    /* BEBIDAS */
    .beb-wrap{padding:14px 12px 120px;}
    .beb-item{display:flex;justify-content:space-between;align-items:center;padding:13px;background:#fff;border-radius:14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;transition:transform .15s;}
    .beb-item:active{transform:scale(.97);}
    .beb-name{font-weight:800;font-size:14px;}
    .beb-desc{font-size:11px;color:#999;margin-top:2px;}

    /* SEARCH BAR */
    .search-wrap{background:#fff;padding:8px 12px;border-bottom:2px solid #F0DEB4;position:sticky;top:130px;z-index:85;}
    .search-inner{position:relative;}
    .search-input{width:100%;padding:10px 36px 10px 40px;border:2px solid #E8C89A;border-radius:50px;font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;color:#3B1A0A;background:#FFF5D0;outline:none;transition:border-color .2s;}
    .search-input:focus{border-color:#C41E3A;background:#fff;}
    .search-input::placeholder{color:#C8A96A;font-weight:600;}
    .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;}
    .search-clear{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:16px;cursor:pointer;color:#aaa;padding:4px;}
    .no-results{text-align:center;padding:48px 20px;color:#C8A96A;}
    .plus-circle{background:#C41E3A;color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}

    /* SPLASH SCREEN */
    .splash{position:fixed;inset:0;background:#000;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;overflow:hidden;}
    @keyframes splashFadeOut{0%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05)}}
    .splash.out{animation:splashFadeOut .5s ease forwards;pointer-events:none;}
    @keyframes logoIn{0%{opacity:0;transform:translateY(-20px)}100%{opacity:1;transform:translateY(0)}}
    .splash-logo{animation:logoIn .6s .2s ease both;text-align:center;}
    @keyframes logoFloat{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-14px) rotate(1.5deg)}}
    .splash-logo-img{animation:logoFloat 3.2s ease-in-out infinite;display:block;}
    @keyframes videoIn{0%{opacity:0;transform:scale(.95)}100%{opacity:1;transform:scale(1)}}
    /* PORTADA video a pantalla completa: reel nítido + fondo desenfocado */
    .cover-bg,.cover-fg{position:absolute;inset:0;width:100%;height:100%;display:block;}
    .cover-bg{z-index:0;object-fit:cover;filter:blur(22px) saturate(1.15);transform:scale(1.12);}
    .cover-fg{z-index:1;object-fit:contain;}
    .cover-scrim{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.30) 0%,rgba(0,0,0,.04) 38%,rgba(0,0,0,.62) 100%);}
    .portada{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:12px;padding:0 20px calc(34px + env(safe-area-inset-bottom));text-align:center;}
    .portada-logo-img{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 8px 32px rgba(0,0,0,.45);background:#fff;animation:logoFloat 3.2s ease-in-out infinite;}
    .portada-title{font-family:'Anton',sans-serif;font-size:40px;color:#fff;letter-spacing:3px;line-height:1;text-shadow:0 3px 18px rgba(0,0,0,.65);}
    .portada-tagline{font-size:11px;color:rgba(255,255,255,.88);letter-spacing:2px;text-transform:uppercase;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.65);}
    .cover-btn{margin-top:8px;background:#C41E3A;border:none;border-radius:50px;padding:15px 46px;font-family:'Anton',sans-serif;font-size:22px;letter-spacing:2px;color:#fff;cursor:pointer;box-shadow:0 6px 22px rgba(196,30,58,.5);transition:transform .15s;animation:btnIn .5s .3s ease both;}
    .cover-btn:active{transform:scale(.95);}
    .cover-count{font-size:11px;color:rgba(255,255,255,.82);font-weight:800;letter-spacing:1px;text-shadow:0 2px 8px rgba(0,0,0,.6);min-height:14px;}
    @keyframes btnIn{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
    .splash-btn{animation:btnIn .5s 1s ease both;background:#F4C430;border:none;border-radius:50px;padding:14px 36px;font-family:'Anton',sans-serif;font-size:22px;letter-spacing:1px;color:#2C1810;cursor:pointer;margin-top:20px;box-shadow:0 4px 16px rgba(0,0,0,.3);transition:transform .15s;}
    .splash-btn:active{transform:scale(.95);}
    .splash-tagline{font-size:11px;color:rgba(255,255,255,.7);letter-spacing:2px;text-transform:uppercase;margin-top:6px;font-weight:700;animation:logoIn .6s .4s ease both;}
  </style>
