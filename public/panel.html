<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Conversaciones – CreBot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; }

    /* Header */
    header {
      background: #075e54;
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header span { font-size: 13px; opacity: 0.75; margin-left: auto; }

    /* Layout */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 340px;
      background: #fff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .search-wrap {
      padding: 10px 12px;
      background: #f6f6f6;
      border-bottom: 1px solid #e0e0e0;
    }
    .search-wrap input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 20px;
      border: none;
      background: #fff;
      font-size: 14px;
      outline: none;
      box-shadow: 0 1px 3px rgba(0,0,0,.1);
    }
    .contacts-list {
      flex: 1;
      overflow-y: auto;
    }
    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f2f2f2;
      transition: background .15s;
    }
    .contact-item:hover { background: #f5f5f5; }
    .contact-item.active { background: #ebebeb; }
    .avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #25d366;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .contact-info { flex: 1; min-width: 0; }
    .contact-phone { font-weight: 600; font-size: 15px; color: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .contact-meta { font-size: 12px; color: #888; margin-top: 2px; }

    /* Chat area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #eae0d5;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c9b99a' fill-opacity='0.18'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      overflow: hidden;
    }
    .chat-header {
      background: #f0f0f0;
      padding: 12px 20px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .chat-header .avatar { width: 38px; height: 38px; font-size: 16px; }
    .chat-header-info .phone { font-weight: 600; font-size: 15px; }
    .chat-header-info .sub { font-size: 12px; color: #666; }
    .chat-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 15px;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    .msg-row.bot { flex-direction: row-reverse; }
    .bubble {
      max-width: 65%;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.45;
      position: relative;
      word-wrap: break-word;
      white-space: pre-wrap;
      box-shadow: 0 1px 2px rgba(0,0,0,.15);
    }
    .bubble.cliente {
      background: #fff;
      border-top-left-radius: 0;
    }
    .bubble.bot {
      background: #dcf8c6;
      border-top-right-radius: 0;
    }
    .bubble.asesor {
      background: #1a5276;
      color: #fff;
      border-top-right-radius: 0;
    }
    .bubble.asesor .time { color: #a9cce3; }
    .bubble .time {
      font-size: 11px;
      color: #999;
      margin-top: 4px;
      text-align: right;
    }

    /* Refresh indicator */
    .refresh-badge {
      margin-left: auto;
      font-size: 12px;
      opacity: 0.7;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4caf50;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .3; }
    }

    .empty-state { text-align: center; color: #aaa; padding: 40px 16px; font-size: 14px; }
  </style>
</head>
<body>

<header>
  <div style="font-size:24px">🤖</div>
  <h1>CreBot – Panel de Conversaciones</h1>
  <span class="refresh-badge">
    <span class="dot"></span>
    Auto-actualiza cada 10s
  </span>
</header>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Buscar por teléfono..." oninput="filterContacts()" />
    </div>
    <div class="contacts-list" id="contactsList">
      <div class="empty-state">Cargando conversaciones...</div>
    </div>
  </div>

  <!-- Chat -->
  <div class="chat-area" id="chatArea">
    <!-- Header -->
    <div class="chat-header" id="chatHeader" style="display:none;">
      <div class="avatar" style="width:38px;height:38px;font-size:16px;">👤</div>
      <div class="chat-header-info">
        <div class="phone" id="chatHeaderPhone"></div>
        <div class="sub" id="chatHeaderSub"></div>
      </div>
    </div>

    <!-- Placeholder cuando no hay chat seleccionado -->
    <div class="chat-placeholder" id="chatPlaceholder">Selecciona una conversación</div>

    <!-- Mensajes -->
    <div class="messages" id="messagesContainer" style="display:none;"></div>

    <!-- Barra de envío (siempre en el DOM, oculta hasta seleccionar chat) -->
    <div id="composeBar" style="display:none; padding: 10px; border-top: 1px solid #ddd; display:none; gap: 8px; background: white; flex-shrink:0;">
      <textarea id="mensajeInput" placeholder="Escribe un mensaje..."
        style="flex:1; padding: 10px; border: 1px solid #ddd; border-radius: 10px; outline: none; resize: none; height: 40px; max-height: 120px; overflow-y: auto; font-family: inherit; font-size: 14px;"
        onkeypress="if(event.key==='Enter' && !event.shiftKey) { event.preventDefault(); enviarMensaje(); }"></textarea>
      <button onclick="enviarMensaje()"
        style="padding: 10px 20px; background: #075e54; color: white; border: none; border-radius: 20px; cursor: pointer; font-size:14px;">
        Enviar
      </button>
    </div>
  </div>
</div>

<script>
  const KEY = new URLSearchParams(location.search).get('key') || '';
  let contacts = [];
  let phoneSeleccionado = null;

  function apiUrl(path) {
    return `${path}?key=${encodeURIComponent(KEY)}`;
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return d.toLocaleString('es-CO', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function formatTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
  }

  async function loadContacts() {
    try {
      const res = await fetch(apiUrl('/api/conversaciones'));
      if (!res.ok) { console.error('Error cargando contactos, status:', res.status); return; }
      contacts = await res.json();
      renderContacts();
    } catch (e) {
      console.error("Error fetch:", e);
    }
  }

  function renderContacts() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const filtered = query ? contacts.filter(c => c.phone.includes(query)) : contacts;

    const list = document.getElementById('contactsList');
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state">Sin resultados</div>';
      return;
    }

    list.innerHTML = filtered.map(c => `
      <div class="contact-item${c.phone === phoneSeleccionado ? ' active' : ''}" onclick="selectPhone('${c.phone}')">
        <div class="avatar">👤</div>
        <div class="contact-info">
          <div class="contact-phone">+${c.phone}</div>
          <div class="contact-meta">${c.total_mensajes} mensajes · ${formatDate(c.ultimo_mensaje)}</div>
        </div>
      </div>
    `).join('');
  }

  function filterContacts() {
    renderContacts();
  }

  async function selectPhone(phone) {
    phoneSeleccionado = phone;
    renderContacts();
    // Mostrar secciones del chat
    document.getElementById('chatPlaceholder').style.display = 'none';
    document.getElementById('chatHeader').style.display = 'flex';
    document.getElementById('messagesContainer').style.display = 'flex';
    document.getElementById('composeBar').style.display = 'flex';
    document.getElementById('chatHeaderPhone').textContent = '+' + phone;
    document.getElementById('chatHeaderSub').textContent = 'Cargando mensajes...';
    await refreshMessages(phone);
    document.getElementById('mensajeInput').focus();
  }

  async function refreshMessages(phone) {
    try {
      const res = await fetch(apiUrl(`/api/conversacion/${phone}`));
      if (!res.ok) { console.error('Error cargando mensajes'); return; }
      const msgs = await res.json();

      document.getElementById('chatHeaderSub').textContent = msgs.length + ' mensajes';

      const container = document.getElementById('messagesContainer');
      const atBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;

      container.innerHTML = msgs.length === 0
        ? '<div class="empty-state">Sin mensajes</div>'
        : msgs.map(bubbleRow).join('');

      if (atBottom) container.scrollTop = container.scrollHeight;
    } catch (e) {
      console.error(e);
    }
  }

  function bubbleRow(m) {
    const side = m.rol === 'cliente' ? 'cliente' : m.rol;
    const rowClass = m.rol === 'cliente' ? '' : 'bot';
    const prefix = m.rol === 'asesor' ? '🧑‍💼 ' : '';
    return `
      <div class="msg-row ${rowClass}">
        <div class="bubble ${side}">
          ${escapeHtml(m.mensaje)}
          <div class="time">${prefix}${formatTime(m.created_at)}</div>
        </div>
      </div>`;
  }

  function enviarMensaje() {
    const mensaje = document.getElementById('mensajeInput').value.trim();
    if (!mensaje || !phoneSeleccionado) return;
    document.getElementById('mensajeInput').value = '';
    fetch('/api/enviar-mensaje', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: phoneSeleccionado, mensaje, key: KEY })
    }).then(r => r.json()).then(data => {
      if (data.ok) {
        refreshMessages(phoneSeleccionado);
      } else {
        console.error('Error enviando:', data.error);
        document.getElementById('mensajeInput').value = mensaje;
      }
    }).catch(e => {
      console.error(e);
      document.getElementById('mensajeInput').value = mensaje;
    });
  }

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function reproducirAlerta() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();

    function beep(freq, start, duration, volume) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'square';
      gain.gain.setValueAtTime(volume, ctx.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + start + duration);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + duration);
    }

    // Tres beeps fuertes tipo alerta
    beep(880, 0, 0.15, 1.5);
    beep(880, 0.2, 0.15, 1.5);
    beep(880, 0.4, 0.3, 1.5);
  }

  // Registro del total de mensajes por contacto para detectar mensajes nuevos
  let ultimosTotales = {};

  // Auto-refresh: solo mensajes, sin tocar la barra de envío
  setInterval(async () => {
    const prevContacts = contacts.slice();
    await loadContacts();

    // Detectar si algún contacto tiene más mensajes que antes
    let hayNuevos = false;
    for (const c of contacts) {
      const prevTotal = ultimosTotales[c.phone];
      if (prevTotal !== undefined && Number(c.total_mensajes) > Number(prevTotal)) {
        hayNuevos = true;
      }
      ultimosTotales[c.phone] = c.total_mensajes;
    }
    // También detectar contactos nuevos (que no estaban antes)
    if (contacts.length > prevContacts.length) hayNuevos = true;

    if (hayNuevos) reproducirAlerta();

    if (phoneSeleccionado) await refreshMessages(phoneSeleccionado);
  }, 10000);

  // Inicializar totales en la carga inicial para no disparar alerta al abrir
  loadContacts().then(() => {
    for (const c of contacts) ultimosTotales[c.phone] = c.total_mensajes;
  });

</script>

</body>
</html>
